app = "mint-safety-verdict"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  CIRCLE_NETWORK = "testnet"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
